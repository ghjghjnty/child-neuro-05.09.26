name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      # 1. Клонирование репозитория
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Настройка Node.js (v20 LTS)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # 3. Настройка Java JDK (Temurin 17 для Android Gradle Plugin)
      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      # 4. Установка зависимостей проекта и Capacitor
      - name: Install dependencies
        run: |
          npm install
          npm install @capacitor/cli @capacitor/android --save-dev

      # 5. Сборка веб-приложения (Vite -> dist)
      - name: Build Web App
        run: npm run build

      # 6. Инициализация и синхронизация Android платформы
      - name: Setup & Sync Android project
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      # 7. Сборка отладочного APK с помощью Gradle
      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      # 8. Загрузка готового APK в артефакты GitHub Actions
      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: artemka-neuroplayer-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
